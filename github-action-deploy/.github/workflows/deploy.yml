name: Deploy Gate V1

# Gates "deploy checkout-api to production" on an AtlaSent permit.
#
# production.deploy is change-controlled: the runtime requires a verified
# workload identity and a change plan, and refuses a request without them
# (ACTOR_UNVERIFIED / EXECUTION_PAYLOAD_HASH_REQUIRED). The action supplies
# both: it exchanges this job's GitHub OIDC token for the identity (hence
# `id-token: write`) and derives the plan from the commit. A hand-written curl
# call cannot, which is why this example no longer uses one.
#
# Fail-closed: in the default `enforce` mode the gate evaluates, verifies and
# consumes the permit, and fails the step on anything but a verified allow.
# The deploy step runs only when `verified` is true.
#
# Nothing here asserts approvals or a change window. Approvals come from real
# PR reviews (approvals-from: pr-reviews, the default) and the change window
# is checked server-side.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Gate and deploy checkout-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # approvals are read from the merged PR's reviews
      id-token: write       # production.deploy requires a verified workload identity
    steps:
      - uses: actions/checkout@v4

      - name: AtlaSent gate
        id: gate
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: production.deploy
          target-id: checkout-api
          environment: production
          # REQUIRED: your runtime base ending in /functions/v1, e.g.
          # https://api.atlasent.io/functions/v1 (self-hosted: your own
          # https://<project-ref>.supabase.co/functions/v1).
          api-url: ${{ secrets.ATLASENT_API_URL }}

      - name: Deploy checkout-api
        if: steps.gate.outputs.verified == 'true'
        run: |
          echo "Deploying checkout-api to production at ${{ github.sha }}"
          # Replace this line with your deployment command.

      - name: Audit evidence
        if: always()
        run: |
          echo "action=production.deploy"
          echo "target=checkout-api"
          echo "sha=${{ github.sha }}"
          echo "decision=${{ steps.gate.outputs.decision }}"
          echo "verified=${{ steps.gate.outputs.verified }}"
          echo "evaluation_id=${{ steps.gate.outputs.evaluation-id }}"
          echo "proof_hash=${{ steps.gate.outputs.proof-hash }}"
