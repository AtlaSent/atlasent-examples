<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtlaSent Browser Guard</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f8fafc;
        color: #1e293b;
      }
      h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
      #status {
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border-radius: 6px;
        font-size: 0.95rem;
        line-height: 1.6;
        background: #e2e8f0;
      }
      #status.allow  { background: #dcfce7; color: #166534; border-left: 4px solid #22c55e; }
      #status.deny   { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
      #status.hold   { background: #fef9c3; color: #713f12; border-left: 4px solid #eab308; }
      #status.escalate { background: #fce7f3; color: #831843; border-left: 4px solid #ec4899; }
      #status.error  { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
    </style>
  </head>
  <body>
    <h1>AtlaSent Browser Guard</h1>
    <p>This page evaluates an action via the AtlaSent SDK and renders the decision below.</p>
    <div id="status">Evaluating&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
