name: Secret-leak grep gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  grep:
    name: grep for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run secret-leak gate
        run: bash scripts/secret-leak-grep.sh
      # Batched into this job (not a new workflow) to avoid another billable job.
      - name: Action types are dot-notation (self-test)
        run: node scripts/check-action-names.mjs --self-test
      - name: Action types are dot-notation
        run: node scripts/check-action-names.mjs
      # sign-release.yml must check its dispatcher before anything else.
      # js-yaml is installed, pinned, outside the workspace.
      - name: Install js-yaml 4.3.2 for the dispatcher guard
        run: npm install --prefix "$RUNNER_TEMP/dispatcher-guard-yaml" js-yaml@4.3.2 --no-audit --no-fund --no-save
      - name: Prove the dispatcher guard rejects the defects it targets
        env:
          JS_YAML_MODULE: ${{ runner.temp }}/dispatcher-guard-yaml/node_modules/js-yaml/dist/js-yaml.mjs
        run: node scripts/check-production-dispatcher.mjs --self-test
      - name: Check the release jobs run the dispatcher check first
        env:
          JS_YAML_MODULE: ${{ runner.temp }}/dispatcher-guard-yaml/node_modules/js-yaml/dist/js-yaml.mjs
        run: node scripts/check-production-dispatcher.mjs --verify-workflows

      - name: Set up Node for webhook compatibility tests
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Build and test webhook receiver
        working-directory: webhook-receiver
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test

