version: 2
updates:
  - package-ecosystem: npm
    # No root package.json: each example is its own npm package.
    directories:
      - "/**"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
