# reconciliation-certify.yaml
#
# AtlaSent policy bundle for reconciliation certify authorization.
# Load into the AtlaSent engine via the console or the API:
#
# NOTE: v1-policy-bundles is disabled in production and will return 404.
# Use the AtlaSent Console UI to load policy bundles instead.
#   curl -X POST https://api.atlasent.io/functions/v1/v1-policy-bundles \
#     -H "Authorization: Bearer $ATLASENT_API_KEY" \
#     -H "Content-Type: application/yaml" \
#     --data-binary @policies/reconciliation-certify.yaml

policy_pack: reconciliation-certify-v1
version: "1.0"

rules:
  - id: authorized-certifier
    description: Only authorized certifiers may certify reconciliations
    condition:
      field: context.certifiedBy
      op: in_group
      value: authorized-certifiers
    on_fail: DENY_CERTIFIER_NOT_AUTHORIZED

  - id: dual-approval-threshold
    description: Reconciliations with balance difference above $10,000 require dual approval
    condition:
      field: context.balanceDifference
      op: gt
      value: 10000
    require:
      dual_approval: true

  - id: period-match
    description: Certifier must be assigned to the period being certified
    condition:
      field: context.period
      op: matches_assignment
    on_fail: DENY_PERIOD_MISMATCH
