# Example: gate two production deploys in one step with the batch
# `evaluations:` input of Atlasent/atlasent-action@v1.
#
# Fail-closed: the step fails when any item is denied or held, or when any
# allow fails permit verification. The deploy step below therefore runs only
# when every item was verified. Per-item results are in the `decisions` output.
#
# production.deploy is change-controlled: each item is evaluated as this job's
# verified workload identity, minted from its GitHub OIDC token (hence
# `id-token: write`). Caller actor values cannot authorize it. Pass the key as
# the ATLASENT_API_KEY environment variable; the action has no api-key input.
name: Deploy with AtlaSent batch gate

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Gate and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate both deploys
        id: atlasent
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
        with:
          api-url: ${{ secrets.ATLASENT_API_URL }}
          evaluations: |
            [
              {"action": "production.deploy", "environment": "production", "context": {"service": "api"}},
              {"action": "production.deploy", "environment": "production", "context": {"service": "worker"}}
            ]

      - name: Show decisions
        env:
          DECISIONS: ${{ steps.atlasent.outputs.decisions }}
        run: echo "$DECISIONS" | jq .

      - name: Deploy application
        run: echo "Deploying api and worker"
        # Add your actual deploy steps here
